[project]
name = "crux"
version = "0.1.0"
description = "Code Recovery from Undocumented eXperiments"
requires-python = ">=3.11"
dependencies = [
    "nbformat>=5.9",
    "networkx>=3.2",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "structlog>=24.1",
    "fastmcp>=3.2",
    "jinja2>=3.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "click>=8.1",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
crux = "crux.cli:main"
crux-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["crux", "crux.detectors", "crux.patches", "mcp_server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"